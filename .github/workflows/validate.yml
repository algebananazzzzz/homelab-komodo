name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  compose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Validate every Compose file
        run: |
          shopt -s nullglob
          for file in stacks/*/*/compose.yml; do
            echo "$file"
            docker compose -f "$file" config --quiet
          done
