# Komodo stays unreachable from GitHub, so it polls: a push to main deploys within 5 minutes without a webhook.
[[procedure]]
name = "sync"
description = "Apply the komodo/ directory of homelab-komodo."
tags = ["komodo"]

[procedure.config]
# Komodo turns the English "Every 5 minutes" into a cron its own validator rejects.
schedule_format = "Cron"
schedule = "0 */5 * * * *"
schedule_alert = false

[[procedure.config.stage]]
name = "Sync"
executions = [
  { execution.type = "RunSync", execution.params.sync = "homelab-komodo" },
]

# Run after a rebuild: apps need the databases and Authentik up before they start.
[[procedure]]
name = "cold-start"
description = "Deploy every app stack in dependency order."
tags = ["komodo"]

[[procedure.config.stage]]
name = "Observability"
executions = [
  { execution.type = "DeployStack", execution.params.stack = "prometheus", execution.params.services = [] },
  { execution.type = "DeployStack", execution.params.stack = "alertmanager", execution.params.services = [] },
  { execution.type = "DeployStack", execution.params.stack = "loki", execution.params.services = [] },
  { execution.type = "DeployStack", execution.params.stack = "tempo", execution.params.services = [] },
]

[[procedure.config.stage]]
name = "Databases"
executions = [
  { execution.type = "DeployStack", execution.params.stack = "postgres", execution.params.services = [] },
  { execution.type = "DeployStack", execution.params.stack = "redis", execution.params.services = [] },
]

[[procedure.config.stage]]
name = "Identity"
executions = [
  { execution.type = "DeployStack", execution.params.stack = "authentik", execution.params.services = [] },
]

[[procedure.config.stage]]
name = "Apps"
executions = [
  { execution.type = "DeployStack", execution.params.stack = "kaneo", execution.params.services = [] },
  { execution.type = "DeployStack", execution.params.stack = "outline", execution.params.services = [] },
  { execution.type = "DeployStack", execution.params.stack = "glance", execution.params.services = [] },
  { execution.type = "DeployStack", execution.params.stack = "beaverhabits", execution.params.services = [] },
  { execution.type = "DeployStack", execution.params.stack = "windmill", execution.params.services = [] },
]
