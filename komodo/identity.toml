[[stack]]
name = "authentik"
description = "Single sign-on and invitations at sso.algebananazzzzz.com."
tags = ["identity"]
deploy = true

[stack.config]
server = "svc-apps-01"
repo = "algebananazzzzz/homelab-komodo"
branch = "main"
run_directory = "stacks/identity/authentik"
file_paths = ["compose.yml"]
ignore_services = ["register"]
# Single quotes keep Compose from expanding a `$` inside a value.
environment = """
AUTHENTIK_SECRET_KEY='[[AUTHENTIK_SECRET_KEY]]'
SMTP_HOST='[[SMTP_HOST]]'
SMTP_PORT='[[SMTP_PORT]]'
SMTP_USERNAME='[[SMTP_USERNAME]]'
SMTP_PASSWORD='[[SMTP_PASSWORD]]'
POSTGRES_ADMIN_PASSWORD='[[POSTGRES_ADMIN_PASSWORD]]'
OUTLINE_OIDC_CLIENT_SECRET='[[OUTLINE_OIDC_CLIENT_SECRET]]'
KANEO_OIDC_CLIENT_SECRET='[[KANEO_OIDC_CLIENT_SECRET]]'
KOMODO_OIDC_CLIENT_SECRET='[[KOMODO_OIDC_CLIENT_SECRET]]'
WINDMILL_OIDC_CLIENT_SECRET='[[WINDMILL_OIDC_CLIENT_SECRET]]'
CORUM_OIDC_CLIENT_SECRET='[[CORUM_OIDC_CLIENT_SECRET]]'
"""
# Blueprints are re-read on restart, and Compose does not see a bind-mounted file change, so every deploy recreates.
config_files = ["consul/authentik.json", "blueprints/10-groups.yaml", "blueprints/20-authentication.yaml", "blueprints/30-recovery.yaml", "blueprints/40-enrollment.yaml", "blueprints/50-applications.yaml"]
extra_args = ["--force-recreate"]
