[[stack]]
name = "authelia"
description = "Single sign-on at auth.algebananazzzzz.com and auth.home.arpa."
tags = ["identity"]
deploy = true

[stack.config]
server = "svc-apps-01"
repo = "algebananazzzzz/homelab-komodo"
branch = "main"
run_directory = "stacks/identity/authelia"
file_paths = ["compose.yml"]
ignore_services = ["register"]
# Single quotes keep Compose from expanding a `$` inside a value.
environment = """
SESSION_SECRET='[[AUTHELIA_SESSION_SECRET]]'
STORAGE_ENCRYPTION_KEY='[[AUTHELIA_STORAGE_ENCRYPTION_KEY]]'
JWT_SECRET='[[AUTHELIA_JWT_SECRET]]'
OIDC_HMAC_SECRET='[[AUTHELIA_OIDC_HMAC_SECRET]]'
OIDC_JWKS_KEY='[[AUTHELIA_OIDC_JWKS_KEY]]'
USER_PASSWORD_DIGEST='[[AUTHELIA_USER_PASSWORD_DIGEST]]'
POSTGRES_PASSWORD='[[POSTGRES_PASSWORD]]'
REDIS_PASSWORD='[[REDIS_PASSWORD]]'
OUTLINE_CLIENT_SECRET_DIGEST='[[OUTLINE_OIDC_CLIENT_SECRET_DIGEST]]'
KANEO_CLIENT_SECRET_DIGEST='[[KANEO_OIDC_CLIENT_SECRET_DIGEST]]'
KOMODO_CLIENT_SECRET_DIGEST='[[KOMODO_OIDC_CLIENT_SECRET_DIGEST]]'
WINDMILL_CLIENT_SECRET_DIGEST='[[WINDMILL_OIDC_CLIENT_SECRET_DIGEST]]'
"""
# Authelia reads its config only at startup, and Compose does not see a bind-mounted file change, so every deploy recreates.
config_files = ["configuration.yml", "consul/authelia.json"]
extra_args = ["--force-recreate"]

[[stack]]
name = "authentik"
description = "Single sign-on and invitations at sso.algebananazzzzz.com."
tags = ["identity"]
deploy = true

[stack.config]
server = "svc-apps-01"
repo = "algebananazzzzz/homelab-komodo"
branch = "main"
run_directory = "stacks/identity/authentik"
file_paths = ["compose.yml"]
ignore_services = ["register"]
# Single quotes keep Compose from expanding a `$` inside a value.
environment = """
AUTHENTIK_SECRET_KEY='[[AUTHENTIK_SECRET_KEY]]'
AUTHENTIK_BOOTSTRAP_PASSWORD='[[AUTHENTIK_BOOTSTRAP_PASSWORD]]'
AUTHENTIK_EMAIL_USERNAME='[[AUTHENTIK_EMAIL_USERNAME]]'
AUTHENTIK_EMAIL_PASSWORD='[[AUTHENTIK_EMAIL_PASSWORD]]'
POSTGRES_PASSWORD='[[POSTGRES_PASSWORD]]'
OUTLINE_OIDC_CLIENT_SECRET='[[OUTLINE_OIDC_CLIENT_SECRET]]'
KANEO_OIDC_CLIENT_SECRET='[[KANEO_OIDC_CLIENT_SECRET]]'
KOMODO_OIDC_CLIENT_SECRET='[[KOMODO_OIDC_CLIENT_SECRET]]'
WINDMILL_OIDC_CLIENT_SECRET='[[WINDMILL_OIDC_CLIENT_SECRET]]'
CORUM_OIDC_CLIENT_SECRET='[[CORUM_OIDC_CLIENT_SECRET]]'
"""
# Blueprints are re-read on restart, and Compose does not see a bind-mounted file change, so every deploy recreates.
config_files = ["consul/authentik.json"]
extra_args = ["--force-recreate"]
