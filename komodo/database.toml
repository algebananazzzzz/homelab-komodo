[[stack]]
name = "postgres"
description = "Shared PostgreSQL for app stacks."
tags = ["database"]
deploy = true

[stack.config]
server = "svc-db-01"
repo = "algebananazzzzz/homelab-komodo"
branch = "main"
run_directory = "stacks/database/postgres"
file_paths = ["compose.yml"]
ignore_services = ["secrets", "register"]
environment = """
OPENBAO_ROLE_ID=[[OPENBAO_ROLE_ID]]
OPENBAO_SECRET_ID=[[OPENBAO_SECRET_ID]]
"""
# A sync redeploys a stack only when a listed file changes, so every file the stack reads is listed.
config_files = ["consul/postgres.json", "initdb/10-databases.sql", "../../../openbao/agent.hcl"]

