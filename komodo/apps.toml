[[stack]]
name = "windmill"
description = "Scripts and schedules at windmill.algebananazzzzz.com."
tags = ["apps"]
deploy = true

[stack.config]
server = "svc-apps-01"
repo = "algebananazzzzz/homelab-komodo"
branch = "main"
run_directory = "stacks/apps/windmill"
file_paths = ["compose.yml"]
ignore_services = ["register", "config_sync"]
# Single quotes keep Compose from expanding a `$` inside a value.
environment = """
POSTGRES_PASSWORD='[[POSTGRES_ADMIN_PASSWORD]]'
WINDMILL_OIDC_CLIENT_SECRET='[[WINDMILL_OIDC_CLIENT_SECRET]]'
"""
# A sync redeploys a stack only when a listed file changes, so every file the stack reads is listed.
config_files = ["consul/windmill.json", "config/windmill-config.yaml"]
