[[stack]]
name = "beaverhabits"
description = "Habit tracker."
tags = ["apps"]
deploy = true

[stack.config]
server = "svc-apps-01"
repo = "algebananazzzzz/homelab-komodo"
branch = "main"
run_directory = "stacks/apps/beaverhabits"
file_paths = ["compose.yml"]
ignore_services = ["register"]
# A sync redeploys a stack only when a listed file changes, so every file the stack reads is listed.
config_files = ["consul/beaverhabits.json"]

[[stack]]
name = "glance"
description = "Dashboards at home.arpa and glance.algebananazzzzz.com."
tags = ["apps"]
deploy = true

[stack.config]
server = "mgmt-01"
repo = "algebananazzzzz/homelab-komodo"
branch = "main"
run_directory = "stacks/apps/glance"
file_paths = ["compose.yml"]
ignore_services = ["register"]
# Compose does not see bind-mounted config change, so a config edit must recreate the containers to take effect.
config_files = ["config/glance.yml", "config/public.yml", "config/shared/base.yml", "config/shared/monitoring.yml", "config/shared/nodes.yml", "config/shared/sidebar.yml", "consul/glance.json", "consul/glance-public.json"]
extra_args = ["--force-recreate"]

[[stack]]
name = "kaneo"
description = "Kanban boards at kaneo.algebananazzzzz.com."
tags = ["apps"]
deploy = true

[stack.config]
server = "svc-apps-01"
repo = "algebananazzzzz/homelab-komodo"
branch = "main"
run_directory = "stacks/apps/kaneo"
file_paths = ["compose.yml"]
ignore_services = ["register"]
# Single quotes keep Compose from expanding a `$` inside a value.
environment = """
POSTGRES_PASSWORD='[[POSTGRES_PASSWORD]]'
AUTH_SECRET='[[KANEO_AUTH_SECRET]]'
OIDC_CLIENT_SECRET='[[KANEO_OIDC_CLIENT_SECRET]]'
"""
# A sync redeploys a stack only when a listed file changes, so every file the stack reads is listed.
config_files = ["consul/kaneo.json"]

