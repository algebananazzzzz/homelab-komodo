name: redis

services:
  register:
    image: curlimages/curl:8.22.0
    # Consul's API listens on the host. The agent keeps these registrations across restarts and reboots.
    network_mode: host
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        for f in /consul/*.json; do
          curl -sSf -X PUT --data-binary "@$$f" http://127.0.0.1:8500/v1/agent/service/register
          echo "registered $$f"
        done
    volumes:
      - ./consul:/consul:ro

  redis:
    container_name: redis
    image: redis:8.10.2
    depends_on:
      register:
        condition: service_completed_successfully
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction", "--requirepass", "${REDIS_PASSWORD:?}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?}
    ports:
      - "6379:6379/tcp"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  redis-data:
    name: homelab-redis-data
