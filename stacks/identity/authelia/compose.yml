name: authelia

services:
  register:
    image: curlimages/curl:8.22.0
    # Consul's API listens on the host. The agent keeps these registrations across restarts and reboots.
    network_mode: host
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        for f in /consul/*.json; do
          curl -sSf -X PUT --data-binary "@$$f" http://127.0.0.1:8500/v1/agent/service/register
          echo "registered $$f"
        done
    volumes:
      - ./consul:/consul:ro

  authelia:
    container_name: authelia
    image: docker.io/authelia/authelia:4.39.20
    depends_on:
      register:
        condition: service_completed_successfully
    # The template filter only reads configuration.yml, so the users file is written here from the environment
    # before the image's own entrypoint starts Authelia.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        umask 077
        cat > /config/users_database.yml <<EOF
        users:
          danielz:
            disabled: false
            displayname: 'Daniel'
            password: '$${USER_PASSWORD_DIGEST}'
            email: 'daniel.zhouqx@gmail.com'
            groups:
              - 'admins'
        EOF
        exec /app/entrypoint.sh --config /etc/authelia/configuration.yml
    environment:
      X_AUTHELIA_CONFIG_FILTERS: template
      SESSION_SECRET: ${SESSION_SECRET:?}
      STORAGE_ENCRYPTION_KEY: ${STORAGE_ENCRYPTION_KEY:?}
      JWT_SECRET: ${JWT_SECRET:?}
      OIDC_HMAC_SECRET: ${OIDC_HMAC_SECRET:?}
      # Base64 of the PEM key, since a Komodo variable holds one line.
      OIDC_JWKS_KEY: ${OIDC_JWKS_KEY:?}
      USER_PASSWORD_DIGEST: ${USER_PASSWORD_DIGEST:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
      OUTLINE_CLIENT_SECRET_DIGEST: ${OUTLINE_CLIENT_SECRET_DIGEST:?}
      KANEO_CLIENT_SECRET_DIGEST: ${KANEO_CLIENT_SECRET_DIGEST:?}
      KOMODO_CLIENT_SECRET_DIGEST: ${KOMODO_CLIENT_SECRET_DIGEST:?}
      WINDMILL_CLIENT_SECRET_DIGEST: ${WINDMILL_CLIENT_SECRET_DIGEST:?}
    ports:
      - "9091:9091/tcp"
    volumes:
      - ./configuration.yml:/etc/authelia/configuration.yml:ro
      - config:/config
    restart: unless-stopped

volumes:
  config:
