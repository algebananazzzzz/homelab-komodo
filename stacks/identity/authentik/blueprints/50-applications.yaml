version: 1
metadata:
  name: homelab-applications
context:
  authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
  invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
  signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
  scope_openid: !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
  scope_profile: !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
entries:
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: homelab-groups
      required: true

  # The managed email mapping always sends email_verified false, which Outline rejects.
  - model: authentik_providers_oauth2.scopemapping
    id: scope-email
    identifiers: {name: "HomeLab OAuth Mapping: OpenID 'email'"}
    attrs:
      scope_name: email
      description: Email address
      expression: |
        return {
            "email": request.user.email,
            "email_verified": request.user.attributes.get("verified_email") == request.user.email,
        }

  # Outline
  - model: authentik_providers_oauth2.oauth2provider
    id: outline-provider
    identifiers: {name: Outline}
    attrs: &provider
      authorization_flow: !Context authorization_flow
      invalidation_flow: !Context invalidation_flow
      signing_key: !Context signing_key
      property_mappings: [!Context scope_openid, !KeyOf scope-email, !Context scope_profile]
      client_type: confidential
      # Blueprint-created providers start with no grant types, which rejects every login.
      grant_types: [authorization_code, refresh_token]
      client_id: outline
      client_secret: !Env OUTLINE_OIDC_CLIENT_SECRET
      sub_mode: hashed_user_id
      issuer_mode: per_provider
      # Komodo names users from the ID token alone; the other apps ignore the extra claims.
      include_claims_in_id_token: true
      redirect_uris:
        - {matching_mode: strict, url: "https://outline.algebananazzzzz.com/auth/oidc.callback"}
  - model: authentik_core.application
    id: outline-app
    identifiers: {slug: outline}
    attrs: {name: Outline, provider: !KeyOf outline-provider, meta_launch_url: "https://outline.algebananazzzzz.com", policy_engine_mode: any}
  - model: authentik_policies.policybinding
    identifiers: {target: !KeyOf outline-app, group: !Find [authentik_core.group, [name, admins]], order: 0}
  - model: authentik_policies.policybinding
    identifiers: {target: !KeyOf outline-app, group: !Find [authentik_core.group, [name, app-outline]], order: 1}
  - model: authentik_policies.policybinding
    identifiers: {target: !KeyOf outline-app, group: !Find [authentik_core.group, [name, members]], order: 2}

  # Kaneo
  - model: authentik_providers_oauth2.oauth2provider
    id: kaneo-provider
    identifiers: {name: Kaneo}
    attrs:
      <<: *provider
      client_id: kaneo
      client_secret: !Env KANEO_OIDC_CLIENT_SECRET
      redirect_uris:
        - {matching_mode: strict, url: "https://kaneo.algebananazzzzz.com/api/auth/oauth2/callback/custom"}
  - model: authentik_core.application
    id: kaneo-app
    identifiers: {slug: kaneo}
    attrs: {name: Kaneo, provider: !KeyOf kaneo-provider, meta_launch_url: "https://kaneo.algebananazzzzz.com", policy_engine_mode: any}
  - model: authentik_policies.policybinding
    identifiers: {target: !KeyOf kaneo-app, group: !Find [authentik_core.group, [name, admins]], order: 0}
  - model: authentik_policies.policybinding
    identifiers: {target: !KeyOf kaneo-app, group: !Find [authentik_core.group, [name, app-kaneo]], order: 1}
  - model: authentik_policies.policybinding
    identifiers: {target: !KeyOf kaneo-app, group: !Find [authentik_core.group, [name, members]], order: 2}

  # Komodo
  - model: authentik_providers_oauth2.oauth2provider
    id: komodo-provider
    identifiers: {name: Komodo}
    attrs:
      <<: *provider
      client_id: komodo
      client_secret: !Env KOMODO_OIDC_CLIENT_SECRET
      redirect_uris:
        - {matching_mode: strict, url: "https://komodo.ops.home.arpa/auth/oidc/callback"}
  - model: authentik_core.application
    id: komodo-app
    identifiers: {slug: komodo}
    attrs: {name: Komodo, provider: !KeyOf komodo-provider, meta_launch_url: "https://komodo.ops.home.arpa", policy_engine_mode: any}
  - model: authentik_policies.policybinding
    identifiers: {target: !KeyOf komodo-app, group: !Find [authentik_core.group, [name, admins]], order: 0}
  - model: authentik_policies.policybinding
    identifiers: {target: !KeyOf komodo-app, group: !Find [authentik_core.group, [name, app-komodo]], order: 1}

  # Windmill
  - model: authentik_providers_oauth2.oauth2provider
    id: windmill-provider
    identifiers: {name: Windmill}
    attrs:
      <<: *provider
      client_id: windmill
      client_secret: !Env WINDMILL_OIDC_CLIENT_SECRET
      redirect_uris:
        - {matching_mode: strict, url: "https://windmill.algebananazzzzz.com/user/login_callback/authentik"}
  - model: authentik_core.application
    id: windmill-app
    identifiers: {slug: windmill}
    attrs: {name: Windmill, provider: !KeyOf windmill-provider, meta_launch_url: "https://windmill.algebananazzzzz.com", policy_engine_mode: any}
  - model: authentik_policies.policybinding
    identifiers: {target: !KeyOf windmill-app, group: !Find [authentik_core.group, [name, admins]], order: 0}
  - model: authentik_policies.policybinding
    identifiers: {target: !KeyOf windmill-app, group: !Find [authentik_core.group, [name, app-windmill]], order: 1}

  # Corum
  - model: authentik_providers_oauth2.oauth2provider
    id: corum-provider
    identifiers: {name: Corum}
    attrs:
      <<: *provider
      client_id: corum
      client_secret: !Env CORUM_OIDC_CLIENT_SECRET
      redirect_uris:
        - {matching_mode: strict, url: "https://corum.algebananazzzzz.com/auth/callback"}
  - model: authentik_core.application
    id: corum-app
    identifiers: {slug: corum}
    attrs: {name: Corum, provider: !KeyOf corum-provider, meta_launch_url: "https://corum.algebananazzzzz.com", policy_engine_mode: any}
  - model: authentik_policies.policybinding
    identifiers: {target: !KeyOf corum-app, group: !Find [authentik_core.group, [name, admins]], order: 0}
  - model: authentik_policies.policybinding
    identifiers: {target: !KeyOf corum-app, group: !Find [authentik_core.group, [name, app-corum]], order: 1}
  - model: authentik_policies.policybinding
    identifiers: {target: !KeyOf corum-app, group: !Find [authentik_core.group, [name, members]], order: 2}
  - model: authentik_policies.policybinding
    identifiers: {target: !KeyOf corum-app, group: !Find [authentik_core.group, [name, guests]], order: 3}
