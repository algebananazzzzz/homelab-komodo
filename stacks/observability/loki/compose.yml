name: loki

services:
  register:
    image: curlimages/curl:8.22.0
    network_mode: host
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        for f in /consul/*.json; do
          curl -sSf -X PUT --data-binary "@$$f" http://127.0.0.1:8500/v1/agent/service/register
          echo "registered $$f"
        done
    volumes:
      - ./consul:/consul:ro

  loki:
    container_name: loki
    image: grafana/loki:3.7.8
    depends_on:
      register:
        condition: service_completed_successfully
    command:
      - -config.file=/etc/loki/loki.yml
    ports:
      - "3100:3100/tcp"
    volumes:
      - ./config/loki.yml:/etc/loki/loki.yml:ro
      - ./rules:/etc/loki/rules:ro
      - data:/loki
    restart: unless-stopped

volumes:
  data:
    name: homelab-loki-data
