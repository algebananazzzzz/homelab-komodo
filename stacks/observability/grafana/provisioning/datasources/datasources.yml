apiVersion: 1

# Dropping a datasource from this file leaves it in Grafana's database, so a removed one is listed here.
deleteDatasources:
  - name: Tempo
    orgId: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    url: http://10.10.10.20:9090
    isDefault: true
    jsonData:
      timeInterval: 15s

  - name: Loki
    uid: loki
    type: loki
    url: http://10.10.10.20:3100

  - name: Alertmanager
    uid: alertmanager
    type: alertmanager
    url: http://10.10.10.20:9093
    jsonData:
      implementation: prometheus
