apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    url: http://10.10.10.20:9090
    isDefault: true
    jsonData:
      timeInterval: 15s

  - name: Loki
    uid: loki
    type: loki
    url: http://10.10.10.20:3100
    jsonData:
      derivedFields:
        - name: trace_id
          matcherRegex: '"trace_id":"(\w+)"'
          datasourceUid: tempo
          # $$ escapes Grafana's environment expansion in provisioning files.
          url: "$${__value.raw}"

  - name: Tempo
    uid: tempo
    type: tempo
    url: http://10.10.10.20:3200
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: -5m
        spanEndTimeShift: 5m
        filterByTraceID: false
        tags:
          - key: service.name
            value: compose_service

  - name: Alertmanager
    uid: alertmanager
    type: alertmanager
    url: http://10.10.10.20:9093
    jsonData:
      implementation: prometheus
