name: grafana

services:
  register:
    image: curlimages/curl:8.22.0
    network_mode: host
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        for f in /consul/*.json; do
          curl -sSf -X PUT --data-binary "@$$f" http://127.0.0.1:8500/v1/agent/service/register
          echo "registered $$f"
        done
    volumes:
      - ./consul:/consul:ro

  grafana:
    container_name: grafana
    image: grafana/grafana:13.2.3
    depends_on:
      register:
        condition: service_completed_successfully
    environment:
      GF_SERVER_ROOT_URL: https://grafana.ops.home.arpa
      # Anonymous visitors are only org Admin; plugins and server settings need this server admin login.
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      # Only reachable inside the home network, and everyone there is trusted, so visitors get Admin without signing in.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    ports:
      - "3000:3000/tcp"
    volumes:
      - ./provisioning:/etc/grafana/provisioning:ro
      - ./dashboards:/var/lib/grafana-dashboards:ro
      - data:/var/lib/grafana
    restart: unless-stopped

volumes:
  data:
    name: homelab-grafana-data
