- name: Buses
  columns:
    - size: full
      widgets:
        # bus.hewliyang.com proxies uNivUS, which replaced NUS NextBus (retired 29 May 2026) and needs a login session Glance cannot hold.
        # The map is fixed; only my four routine legs are drawn, and only their services' arrivals are shown.
        - type: custom-api
          title: NUS Shuttles
          cache: 15s
          url: https://bus.hewliyang.com/api/stop/HSSML-OPP
          subrequests:
            yih:
              url: https://bus.hewliyang.com/api/stop/YIH-OPP
            biz:
              url: https://bus.hewliyang.com/api/stop/BIZ2
            uhall:
              url: https://bus.hewliyang.com/api/stop/UHALL-OPP
          template: |
            {{ define "eta" }}
              {{ $next := .String "arrivalTime" }}
              {{ $then := .String "nextArrivalTime" }}
              <span class="nus-eta nus-{{ .String "name" }}">
                <b>{{ .String "name" }}</b>
                <span>{{ if eq $next "-" }}–{{ else if eq $next "0" "Arr" }}Arr{{ else }}{{ $next }} min{{ end }}</span>
                {{ if ne $then "-" }}<i>{{ $then }}</i>{{ end }}
              </span>
            {{ end }}
            <style>
              .nus { --a1: #f38ba8; --a2: #f9e2af; --d1: #cba6f7; --r2: #a6e3a1; --home: #fab387; --study: #89b4fa; --sport: #a6e3a1; container-type: inline-size; overflow: hidden; }
              html[data-scheme="light"] .nus { --a1: #d20f39; --a2: #df8e1d; --d1: #8839ef; --r2: #40a02b; --home: #fe640b; --study: #1e66f5; --sport: #40a02b; }
              .nus-A1 { --route: var(--a1); } .nus-A2 { --route: var(--a2); } .nus-D1 { --route: var(--d1); } .nus-R2 { --route: var(--r2); }
              .nus-head { display: flex; justify-content: flex-end; gap: 1rem; font-size: 1.1rem; color: var(--color-text-subdue); }
              .nus-head a { color: var(--color-primary); }
              .nus-map-wrap { position: relative; }
              .nus-map { display: block; width: 100%; height: auto; overflow: visible; }
              .nus .line { fill: none; stroke: var(--route); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
              .nus .line.r-A1 { --route: var(--a1); } .nus .line.r-A2 { --route: var(--a2); } .nus .line.r-D1 { --route: var(--d1); } .nus .line.r-R2 { --route: var(--r2); }
              /* the disc only hides the line ends under each icon */
              .nus .station { fill: var(--color-widget-background); }
              /* Lucide icons (ISC): a book at Opp YIH for studying, a sprout at Opp UHall for the stadium, a house at BIZ for Sheares Hall */
              .nus .icon { fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
              .nus .icon.home { stroke: var(--home); } .nus .icon.study { stroke: var(--study); } .nus .icon.sport { stroke: var(--sport); }
              .nus-label { position: absolute; display: grid; gap: 2px; white-space: nowrap; }
              .nus-label.right { transform: translate(3.4cqi, -50%); }
              .nus-label.right-up { transform: translate(3.6cqi, calc(-100% - 0.4cqi)); }
              .nus-label.left { transform: translate(calc(-100% - 3.8cqi), 1.6cqi); text-align: right; }
              .nus-label.left .nus-eta { justify-content: flex-end; }
              .nus-leg { color: var(--color-text-highlight); font-weight: 600; font-size: clamp(1rem, 1.55cqi, 1.1rem); }
              .nus-leg i { font-style: normal; font-weight: 400; color: var(--color-text-subdue); }
              .nus-eta { display: flex; gap: 8px; align-items: baseline; font-variant-numeric: tabular-nums; }
              .nus-eta b { color: var(--route); font-size: clamp(1rem, 1.7cqi, 1.2rem); }
              .nus-eta span { color: var(--color-text-highlight); font-size: clamp(1.1rem, 2cqi, 1.4rem); font-weight: 600; }
              .nus-eta i { font-style: normal; color: var(--color-text-subdue); font-size: clamp(1rem, 1.55cqi, 1.1rem); }
              .nus-none { color: var(--color-text-subdue); font-size: 1.1rem; }
              /* too narrow for labels beside the stations: keep the map as a picture and list the legs under it */
              @container (max-width: 560px) {
                .nus-map-wrap { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
                /* the side margins only exist to hold labels, so crop them and let the shape fill the width */
                .nus-map { grid-column: 1 / -1; width: 150%; max-width: none; margin-left: -21%; }
                .nus-map-wrap > .nus-label { position: static; transform: none; text-align: left; }
                .nus-map-wrap > .nus-label .nus-eta { justify-content: flex-start; }
              }
            </style>
            <div class="nus">
              <div class="nus-head">
                <span>updated {{ .JSON.String "etas.lastUpdated" | parseTime "rfc3339" | formatTime "15:04:05" }}</span>
                <a href="">↻ Refresh</a>
              </div>
              <div class="nus-map-wrap">
                <svg viewBox="0 0 720 330" class="nus-map" role="img" aria-label="Shuttle legs between Opp HSSML, Opp YIH, BIZ 2 and University Hall"><path class="line r-R2" d="M217.6 257.6 209.9 255.2 202.2 252.2 194.9 248.8 188.1 244.8 181.6 240.4 175.6 235.7 170.1 230.5 165.0 225.1 160.4 219.3 156.2 213.3 152.5 207.1 149.3 200.6 146.5 194.0 144.3 187.2 142.6 180.3 141.3 173.3 140.6 166.3 140.4 159.3 140.8 152.2 141.7 145.2 143.1 138.3 145.1 131.5 147.7 124.8 150.8 118.3 154.5 112.0 158.8 105.9 163.7 100.1 169.1 94.7 175.2 89.6 181.8 84.9 189.0 80.6 196.6 76.8 203.5 73.7 210.2 71.0 217.0 68.5 223.8 66.3 230.6 64.2 237.3 62.4 244.0 60.7 250.8 59.3 257.5 58.0 264.1 56.9 270.8 56.0 277.4 55.2 284.0 54.6 290.5 54.1 297.0 53.8 303.5 53.5 310.0 53.4 316.4 53.3 322.7 53.4 329.0 53.5 335.3 53.7 341.5 54.0 347.7 54.3 353.8 54.6 359.8 55.0 365.8 55.5 371.8 55.9 377.7 56.3 383.5 56.8 389.2 57.2 394.9 57.6 400.6 58.0"/><path class="line r-D1" d="M219.0 253.3 211.3 251.0 204.0 248.1 197.0 244.8 190.5 241.0 184.3 236.8 178.6 232.3 173.3 227.4 168.4 222.1 164.0 216.6 160.0 210.9 156.4 204.9 153.4 198.7 150.7 192.4 148.6 186.0 147.0 179.4 145.8 172.7 145.1 166.0 144.9 159.3 145.3 152.6 146.1 146.0 147.5 139.4 149.4 132.9 151.8 126.6 154.8 120.4 158.3 114.4 162.3 108.7 167.0 103.2 172.2 98.0 177.9 93.1 184.2 88.6 191.1 84.5 198.5 80.8 205.2 77.9 211.9 75.2 218.5 72.8 225.2 70.5 231.8 68.5 238.4 66.7 245.1 65.1 251.7 63.7 258.2 62.5 264.8 61.4 271.3 60.5 277.9 59.7 284.3 59.1 290.8 58.6 297.2 58.2 303.6 58.0 310.0 57.9 316.3 57.8 322.6 57.9 328.9 58.0 335.1 58.2 341.3 58.5 347.4 58.8 353.5 59.1 359.5 59.5 365.5 59.9 371.4 60.4 377.3 60.8 383.1 61.3 388.9 61.7 394.6 62.1 400.2 62.5"/><path class="line r-D1" d="M399.8 69.5 394.1 69.1 388.4 68.7 382.6 68.2 376.8 67.8 370.9 67.4 365.0 66.9 359.1 66.5 353.1 66.1 347.0 65.8 341.0 65.5 334.9 65.2 328.7 65.0 322.5 64.9 316.3 64.8 310.1 64.9 303.9 65.0 297.6 65.2 291.3 65.6 284.9 66.1 278.6 66.7 272.2 67.4 265.8 68.3 259.4 69.3 253.0 70.6 246.6 71.9 240.2 73.5 233.7 75.3 227.3 77.2 220.8 79.4 214.4 81.7 207.9 84.3 201.5 87.2 194.5 90.7 188.1 94.5 182.2 98.7 176.9 103.1 172.1 107.9 167.9 112.9 164.2 118.2 160.9 123.7 158.2 129.3 156.0 135.1 154.3 141.1 153.0 147.1 152.2 153.2 151.9 159.4 152.1 165.6 152.7 171.8 153.8 177.9 155.3 184.0 157.3 190.0 159.7 195.9 162.6 201.6 165.9 207.1 169.6 212.4 173.7 217.5 178.2 222.4 183.1 226.9 188.5 231.2 194.2 235.1 200.3 238.6 206.8 241.7 213.7 244.4 221.0 246.7"/><path class="line r-A1" d="M222.0 247.7 228.8 253.7 236.2 259.1 244.2 264.2 252.8 269.0 261.9 273.4 271.5 277.4 281.6 281.0 292.1 284.2 302.9 287.1 314.1 289.6 325.5 291.7 337.1 293.4 348.9 294.8 360.9 295.7 372.9 296.3 385.0 296.5 397.1 296.3 409.1 295.7 421.1 294.8 432.9 293.4 444.5 291.7 455.9 289.6 467.1 287.1 477.9 284.2 488.4 281.0 498.5 277.4 508.1 273.4 517.2 269.0 525.8 264.2 533.8 259.1 541.2 253.7 548.0 247.7"/><path class="line r-A2" d="M552.0 252.3 545.0 258.3 537.2 264.1 528.9 269.4 520.0 274.3 510.5 278.8 500.6 283.0 490.3 286.7 479.6 290.0 468.5 292.9 457.1 295.5 445.5 297.6 433.7 299.4 421.7 300.7 409.5 301.7 397.3 302.3 385.0 302.5 372.7 302.3 360.5 301.7 348.3 300.7 336.3 299.4 324.5 297.6 312.9 295.5 301.5 292.9 290.4 290.0 279.7 286.7 269.4 283.0 259.5 278.8 250.0 274.3 241.1 269.4 232.8 264.1 225.0 258.3 218.0 252.3"/><g transform="translate(400 66)"><circle class="station" r="15"/><g class="icon study" transform="translate(-12 -12)"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H19a1 1 0 0 1 1 1v18a1 1 0 0 1-1 1H6.5a1 1 0 0 1 0-5H20"/><path d="M8 11h8"/><path d="M8 7h6"/></g></g><g transform="translate(550 250)"><circle class="station" r="15"/><g class="icon sport" transform="translate(-12 -12)"><path d="M7 20h10"/><path d="M10 20c5.5-2.5.8-6.4 3-10"/><path d="M9.5 9.4c1.1.8 1.8 2.2 2.3 3.7-2 .4-3.5.4-4.8-.3-1.2-.6-2.3-1.9-3-4.2 2.8-.5 4.4 0 5.5.8z"/><path d="M14.1 6a7 7 0 0 0-1.1 4c1.9-.1 3.3-.6 4.3-1.4 1-1 1.6-2.3 1.7-4.6-2.7.1-4 1-4.9 2z"/></g></g><g transform="translate(220 250)"><circle class="station" r="15"/><g class="icon home" transform="translate(-12 -12)"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></g></g></svg>
                <div class="nus-label left" style="left:30.6%;top:75.8%">
                  <div class="nus-leg">Opp HSSML <i>→ Opp YIH</i></div>
                  {{ $shown := false }}
                  {{ range .JSON.Array "etas.timings" }}{{ if eq (.String "name") "D1" "R2" }}{{ $shown = true }}{{ template "eta" . }}{{ end }}{{ end }}
                  {{ if not $shown }}<span class="nus-none">No D1 or R2</span>{{ end }}
                </div>
                <div class="nus-label right" style="left:55.6%;top:20%">
                  <div class="nus-leg">Opp YIH <i>→ BIZ 2</i></div>
                  {{ $shown := false }}
                  {{ range (.Subrequest "yih").JSON.Array "etas.timings" }}{{ if eq (.String "name") "D1" }}{{ $shown = true }}{{ template "eta" . }}{{ end }}{{ end }}
                  {{ if not $shown }}<span class="nus-none">No D1</span>{{ end }}
                </div>
                <div class="nus-label right-up" style="left:30.6%;top:75.8%">
                  <div class="nus-leg">BIZ 2 <i>→ UHall</i></div>
                  {{ $shown := false }}
                  {{ range (.Subrequest "biz").JSON.Array "etas.timings" }}{{ if eq (.String "name") "A1" }}{{ $shown = true }}{{ template "eta" . }}{{ end }}{{ end }}
                  {{ if not $shown }}<span class="nus-none">No A1</span>{{ end }}
                </div>
                <div class="nus-label right" style="left:76.4%;top:75.8%">
                  <div class="nus-leg">Opp UHall <i>→ Opp HSSML</i></div>
                  {{ $shown := false }}
                  {{ range (.Subrequest "uhall").JSON.Array "etas.timings" }}{{ if eq (.String "name") "A2" }}{{ $shown = true }}{{ template "eta" . }}{{ end }}{{ end }}
                  {{ if not $shown }}<span class="nus-none">No A2</span>{{ end }}
                </div>
              </div>
            </div>

    - size: small
      widgets:
        # arrivelah proxies LTA DataMall bus arrivals without needing an account key.
        - type: group
          widgets:
            - type: custom-api
              title: Blk 22
              cache: 15s
              url: https://arrivelah2.busrouter.sg/?id=81179
              template: &bus-arrivals |
                {{ $shown := false }}
                <div style="display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: .5rem 1rem; align-items: baseline; text-align: right; white-space: nowrap;">
                {{ range .JSON.Array "services" }}
                  {{ if eq (.String "no") "10" "30" "30e" }}
                    {{ $shown = true }}
                    {{ $next := div (.Int "next.duration_ms") 60000 }}
                    <span class="size-h4 color-highlight" style="text-align: left;">{{ .String "no" }}</span>
                    <span class="size-h4">{{ if lt $next 1 }}Arr{{ else }}{{ $next }} min{{ end }}</span>
                    <span class="color-subdue">{{ if ne (.String "subsequent.time") "" }}{{ div (.Int "subsequent.duration_ms") 60000 }} min{{ end }}</span>
                  {{ end }}
                {{ end }}
                </div>
                {{ if not $shown }}<p class="color-subdue">No 10, 30 or 30e buses right now</p>{{ end }}
            - type: custom-api
              title: Heng Mui Keng Terr
              cache: 15s
              url: https://arrivelah2.busrouter.sg/?id=16069
              template: *bus-arrivals
