$include: shared/base.yml

pages:
  - name: Home
    columns:
      - size: small
        widgets:
          $include: shared/sidebar.yml
          - type: custom-api
            title: Habits
            cache: 1m
            url: https://beaverhabits.svc.home.arpa/api/v1/habits/export
            template: |
              <div style="display: grid; grid-template-columns: minmax(0, 2fr) repeat(5, minmax(0, 1fr)); gap: .5rem .25rem; align-items: center; text-align: center;">
                <span></span>
                {{ range $i := 5 }}
                  {{ $day := offsetNow (printf "-%dh" (mul (sub 4 $i) 24)) }}
                  <span class="color-subdue size-h6">{{ $day.Format "Mon" }}<br>{{ $day.Format "2" }}</span>
                {{ end }}
                {{ range .JSON.Array "habits" }}
                  {{ if eq (.String "status") "" }}
                    {{ $records := .Array "records" }}
                    <span style="text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{{ .String "name" }}</span>
                    {{ range $i := 5 }}
                      {{ $date := (offsetNow (printf "-%dh" (mul (sub 4 $i) 24))).Format "2006-01-02" }}
                      {{ $done := false }}
                      {{ range $records }}
                        {{ if and (eq (.String "day") $date) (.Bool "done") }}{{ $done = true }}{{ end }}
                      {{ end }}
                      <span class="{{ if $done }}color-primary{{ else }}color-subdue{{ end }}">{{ if $done }}✓{{ else }}·{{ end }}</span>
                    {{ end }}
                  {{ end }}
                {{ end }}
              </div>

      - size: full
        widgets:
          - type: monitor
            title: Services
            cache: 30s
            sites:
              - title: Kaneo
                url: https://${KANEO_HOSTNAME}
                icon: https://${KANEO_HOSTNAME}/favicon.ico
              - title: Outline
                url: https://${OUTLINE_HOSTNAME}
                icon: si:outline
              - title: Beaver Habits
                url: https://beaverhabits.svc.home.arpa
                icon: si:todoist

          - type: monitor
            title: Media
            cache: 30s
            sites:
              - title: Jellyfin
                url: http://100.116.110.63:8096/web
                check-url: http://192.168.50.39:8096/web
                icon: si:jellyfin
              - title: Radarr
                url: http://100.116.110.63:7878/radarr/
                check-url: http://192.168.50.39:7878/radarr/
                icon: si:radarr
              - title: Sonarr
                url: http://100.116.110.63:8989/sonarr/
                check-url: http://192.168.50.39:8989/sonarr/
                icon: si:sonarr

          - type: monitor
            title: Management
            cache: 30s
            sites:
              - title: Authelia
                url: https://auth.home.arpa
                icon: si:authelia
              - title: Pi-hole
                url: https://pihole.ops.home.arpa/admin/
                icon: si:pihole
              - title: Traefik
                url: https://traefik.ops.home.arpa/dashboard/
                icon: si:traefikproxy
              - title: Consul
                url: https://consul.ops.home.arpa/ui/
                icon: si:consul
              - title: Komodo
                url: https://komodo.ops.home.arpa
                icon: di:komodo
              # The health endpoint fails while OpenBao is sealed, which is when deploys stop.
              - title: OpenBao
                url: https://openbao.ops.home.arpa/ui/
                check-url: https://openbao.ops.home.arpa/v1/sys/health
                icon: di:openbao
              - title: Prometheus
                url: https://prometheus.ops.home.arpa
                icon: si:prometheus
              - title: UGOS
                url: https://100.116.110.63:9443/
                icon: si:ubiquiti
                allow-insecure: true

          - $include: shared/nodes.yml

  - $include: shared/monitoring.yml
