$include: shared/base.yml

pages:
  - name: Home
    columns:
      - size: small
        widgets:
          $include: shared/sidebar.yml

      - size: full
        widgets:
          - type: monitor
            title: Services
            cache: 30s
            sites:
              - title: Kaneo
                url: https://${KANEO_HOSTNAME}
                icon: https://${KANEO_HOSTNAME}/favicon.ico
              - title: Outline
                url: https://${OUTLINE_HOSTNAME}
                icon: si:outline
              - title: Windmill
                url: https://${WINDMILL_HOSTNAME}
                icon: di:windmill
              - title: Authentik
                url: https://${AUTHENTIK_HOSTNAME}
                icon: si:authentik

          - type: monitor
            title: Media
            cache: 30s
            sites:
              - title: Jellyfin
                url: https://jellyfin.media.home.arpa/web/
                check-url: http://10.10.10.1:8096/web/
                icon: si:jellyfin
              - title: Jellyseerr
                url: https://jellyseerr.media.home.arpa/login
                check-url: http://10.10.10.1:5055/login
                icon: di:jellyseerr
              - title: Radarr
                url: https://radarr.media.home.arpa/radarr/
                check-url: http://10.10.10.1:7878/radarr/
                icon: si:radarr
              - title: Sonarr
                url: https://sonarr.media.home.arpa/sonarr/
                check-url: http://10.10.10.1:8989/sonarr/
                icon: si:sonarr
              - title: Lidarr
                url: https://lidarr.media.home.arpa/lidarr/
                check-url: http://10.10.10.1:8686/lidarr/
                icon: di:lidarr
              - title: Bazarr
                url: https://bazarr.media.home.arpa/bazarr
                check-url: http://10.10.10.1:6767/bazarr
                icon: di:bazarr
              - title: Prowlarr
                url: https://prowlarr.media.home.arpa/prowlarr/
                check-url: http://10.10.10.1:9696/prowlarr/
                icon: di:prowlarr

          - type: monitor
            title: Management
            cache: 30s
            sites:
              - title: Pi-hole
                url: https://pihole.ops.home.arpa/admin/
                icon: si:pihole
              - title: Traefik
                url: https://traefik.ops.home.arpa/dashboard/
                icon: si:traefikproxy
              - title: Consul
                url: https://consul.ops.home.arpa/ui/
                icon: si:consul
              - title: Komodo
                url: https://komodo.ops.home.arpa
                icon: di:komodo
              - title: Prometheus
                url: https://prometheus.ops.home.arpa
                icon: si:prometheus
              - title: UGOS
                url: https://ugos.ops.home.arpa/
                icon: si:ubiquiti

          - $include: shared/nodes.yml

  - $include: shared/buses.yml

  - $include: shared/monitoring.yml
