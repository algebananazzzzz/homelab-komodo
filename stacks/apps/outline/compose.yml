name: outline

services:
  register:
    image: curlimages/curl:8.22.0
    network_mode: host
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        for f in /consul/*.json; do
          curl -sSf -X PUT --data-binary "@$$f" http://127.0.0.1:8500/v1/agent/service/register
          echo "registered $$f"
        done
    volumes:
      - ./consul:/consul:ro

  outline:
    container_name: outline
    image: outlinewiki/outline:1.10.1
    depends_on:
      register:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://admin:${POSTGRES_PASSWORD:?}@postgres.service.consul:5432/outline?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:?}@redis.service.consul:6379/3
      SECRET_KEY: ${SECRET_KEY:?}
      UTILS_SECRET: ${UTILS_SECRET:?}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?}
      NODE_ENV: production
      URL: https://outline.algebananazzzzz.com
      PORT: 3000
      FORCE_HTTPS: "false"
      PGSSLMODE: disable
      FILE_STORAGE: local
      FILE_STORAGE_LOCAL_ROOT_DIR: /var/lib/outline/data
      OIDC_CLIENT_ID: outline
      OIDC_AUTH_URI: https://auth.algebananazzzzz.com/api/oidc/authorization
      OIDC_TOKEN_URI: https://auth.algebananazzzzz.com/api/oidc/token
      OIDC_USERINFO_URI: https://auth.algebananazzzzz.com/api/oidc/userinfo
      OIDC_DISPLAY_NAME: HomeLab SSO
      OIDC_SCOPES: openid profile email
      NODE_EXTRA_CA_CERTS: /etc/ssl/certs/ca-certificates.crt
    ports:
      - "3001:3000/tcp"
    volumes:
      - outline-data:/var/lib/outline/data
      - /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
    restart: unless-stopped

volumes:
  outline-data:
    name: homelab-outline-data
