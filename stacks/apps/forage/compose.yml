name: forage

services:
  # Web search and page extraction for Hermes, which runs on the same host outside Docker.
  forage:
    container_name: forage
    image: ghcr.io/aldemaroc/forage:1.0.1
    # Loopback only: Forage has no auth enabled, and Hermes is its only client.
    ports:
      - "127.0.0.1:3672:3672/tcp"
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1536M
    volumes:
      - ./config/forage.yml:/etc/forage/config.yaml:ro
    restart: unless-stopped
