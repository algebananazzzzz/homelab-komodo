# Applied by `windmill sync-config` before the server starts. Settings and worker groups missing here are deleted,
# except the ones Windmill generates and protects (jwt_secret, uid, the custom_instance passwords).
global_settings:
  base_url: https://windmill.algebananazzzzz.com
  disable_password_login: true
  # The first SSO login creates the account, so a rebuilt instance needs no user setup.
  require_preexisting_user_for_oauth: false
  automate_username_creation: true
  custom_tags:
    - chromium
  oauths:
    authentik:
      id: windmill
      secret:
        envRef: WINDMILL_OIDC_CLIENT_SECRET
      display_name: HomeLab SSO
      login_config:
        scopes: [openid, profile, email]
        auth_url: https://sso.algebananazzzzz.com/application/o/authorize/
        token_url: https://sso.algebananazzzzz.com/application/o/token/
        userinfo_url: https://sso.algebananazzzzz.com/application/o/userinfo/
      connect_config:
        scopes: [openid, profile, email]
        auth_url: https://sso.algebananazzzzz.com/application/o/authorize/
        token_url: https://sso.algebananazzzzz.com/application/o/token/

worker_configs:
  default:
    worker_tags: [deno, python3, go, bash, powershell, dependency, flow, hub, other, bun, php, rust, ansible, csharp, nu, java, duckdb, ruby, rlang, dbt]
  native:
    worker_tags: [nativets, postgresql, mysql, graphql, snowflake, bigquery, mssql, oracledb]
  reports:
    init_bash: |-
      apt-get update
      apt-get install -y chromium
    worker_tags: [deno, python3, go, bash, powershell, dependency, flow, hub, other, bun, chromium]
