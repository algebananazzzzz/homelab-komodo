name: windmill

x-windmill: &windmill
  image: ghcr.io/windmill-labs/windmill:1.820.0
  logging:
    driver: json-file
    options:
      max-size: 20m
      max-file: "5"
  restart: unless-stopped

services:
  register:
    image: curlimages/curl:8.22.0
    network_mode: host
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        for f in /consul/*.json; do
          curl -sSf -X PUT --data-binary "@$$f" http://127.0.0.1:8500/v1/agent/service/register
          echo "registered $$f"
        done
    volumes:
      - ./consul:/consul:ro

  server:
    <<: *windmill
    container_name: windmill
    depends_on:
      register:
        condition: service_completed_successfully
    environment:
      MODE: server
      DATABASE_URL: postgres://admin:${POSTGRES_PASSWORD:?}@postgres.service.consul:5432/windmill?sslmode=disable
      SUPERADMIN_SECRET: ${SUPERADMIN_SECRET:?}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8000/api/version"]
      interval: 5s
      timeout: 3s
      retries: 60
    ports:
      - "8000:8000/tcp"
    volumes:
      - logs:/tmp/windmill/logs
      - /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro

  worker:
    <<: *windmill
    container_name: windmill-worker
    environment:
      MODE: worker
      DATABASE_URL: postgres://admin:${POSTGRES_PASSWORD:?}@postgres.service.consul:5432/windmill?sslmode=disable
      WORKER_GROUP: default
      REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
      NODE_EXTRA_CA_CERTS: /etc/ssl/certs/ca-certificates.crt
      DENO_TLS_CA_STORE: system,mozilla
      WHITELIST_ENVS: REQUESTS_CA_BUNDLE,SSL_CERT_FILE,NODE_EXTRA_CA_CERTS,DENO_TLS_CA_STORE
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 2G
    volumes:
      - logs:/tmp/windmill/logs
      - cache:/tmp/windmill/cache
      - /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro

  bootstrap:
    image: node:22.23.3-alpine
    depends_on:
      server:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c", "apk add --no-cache --quiet curl jq git && exec /bootstrap.sh"]
    environment:
      WM_URL: http://server:8000
      SUPERADMIN_SECRET: ${SUPERADMIN_SECRET:?}
      WINDMILL_OIDC_CLIENT_SECRET: ${WINDMILL_OIDC_CLIENT_SECRET:?}
      WINDMILL_ADMIN_PASSWORD: ${WINDMILL_ADMIN_PASSWORD:?}
      WINDMILL_GIT_SYNC_TOKEN: ${WINDMILL_GIT_SYNC_TOKEN:?}
    volumes:
      - ./bootstrap.sh:/bootstrap.sh:ro
      - ./config:/config:ro

volumes:
  logs:
    name: homelab-windmill-logs
  cache:
    name: homelab-windmill-cache
